name: ROS 2 package build
on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: manager-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container:
      image: ros:humble-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: ws/src/auto-mode-manager
      - uses: actions/checkout@v4
        with:
          repository: tmcit-ararobo-2026a/robot-port
          ref: c4a078ba1a838a24e45e5cf694ab122c0ea50ae2
          path: ws/src/robot-port
      - uses: actions/checkout@v4
        with:
          repository: tmcit-ararobo-2026a/gn10-navigation
          ref: 546643726e74dfdac9765c28e64113a7c55e56e6
          path: ws/src/gn10-navigation
      - uses: actions/checkout@v4
        with:
          repository: tmcit-ararobo-2026a/LiDAR-Perception-System
          ref: 2631e213fb6e438928fb11a18ead4ccc5145884c
          path: ws/src/LiDAR-Perception-System
      - uses: actions/checkout@v4
        with:
          repository: tmcit-ararobo-2026a/field-targets-publisher
          ref: a6008173c9f2e4ce83d527a7f2c3b69d8b581001
          path: ws/src/field-targets-publisher
      - uses: actions/checkout@v4
        with:
          repository: tmcit-ararobo-2026a/shooter_calculator
          ref: 98110b52481cc67a6b486492eb44e1c1a67dbcb7
          path: ws/src/shooter_calculator
      - name: Dependencies
        run: |
          set -e
          apt-get update
          apt-get install -y git clang-format-14
          source /opt/ros/humble/setup.bash
          rosdep update --rosdistro humble
          rosdep install --from-paths ws/src --ignore-src --skip-keys gn10_can -y --rosdistro humble
      - name: CPU build
        working-directory: ws
        run: |
          set -e
          source /opt/ros/humble/setup.bash
          colcon --log-base "${{ runner.temp }}/contract-log" build --executor sequential             --build-base "${{ runner.temp }}/contract-build"             --install-base "${{ runner.temp }}/contract-install"             --cmake-args -DBUILD_GPU_NODES=OFF
      - name: Available package checks
        working-directory: ws
        run: |
          set -e
          source /opt/ros/humble/setup.bash
          source "${{ runner.temp }}/contract-install/setup.bash"
          colcon --log-base "${{ runner.temp }}/contract-test-log" test --executor sequential             --build-base "${{ runner.temp }}/contract-build"             --install-base "${{ runner.temp }}/contract-install"             --event-handlers console_direct+
          colcon test-result --test-result-base "${{ runner.temp }}/contract-build" --verbose
      - name: Normal coordinator startup
        working-directory: ws
        env:
          ROS_LOCALHOST_ONLY: "1"
          ROS_DOMAIN_ID: "229"
          ROS_LOG_DIR: /tmp/manager-smoke-logs
        run: |
          set -e
          source /opt/ros/humble/setup.bash
          source "${{ runner.temp }}/contract-install/setup.bash"
          python3 - <<'PY'
          import subprocess, time
          import rclpy
          from rclpy.node import Node
          from auto_mode_manager.msg import AutoModeStatus
          from robot_port.msg import RobotOperation
          rclpy.init()
          node = Node('manager_smoke')
          status, operations = [], []
          node.create_subscription(AutoModeStatus, '/auto_mode/status', status.append, 10)
          node.create_subscription(RobotOperation, '/robot/operation', operations.append, 10)
          process = subprocess.Popen(['ros2', 'run', 'auto_mode_manager', 'auto_mode_manager_node'])
          try:
              deadline = time.monotonic() + 10
              while time.monotonic() < deadline and (len(status) < 5 or len(operations) < 5):
                  rclpy.spin_once(node, timeout_sec=0.1)
              assert len(status) >= 5 and len(operations) >= 5
              assert all(s.navigation_status == AutoModeStatus.STANDBY for s in status)
              assert all(o.velocity_x_m_s == o.velocity_y_m_s == o.velocity_yaw_rad_s == 0 for o in operations)
              assert all(a.update_sequence < b.update_sequence for a, b in zip(operations, operations[1:]))
          finally:
              process.terminate()
              process.wait(timeout=5)
              node.destroy_node()
              rclpy.shutdown()
          PY
